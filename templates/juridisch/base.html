<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block doc_title %}Indiqa{% endblock %} — Indiqa</title>
  <style>
    :root{
      --bg:#eef1ec;
      --paper:#fbfbf9;
      --text:#1c2b23;
      --text-muted:#4b5850;
      --accent:#2f6a41;
      --accent-soft:#e4ede4;
      --border:#dbe2db;
      --rule:#c7d1c8;
      --fill-bg:#eef3ee;
      --fill-border:#b9cbba;
      --shadow: 0 1px 2px rgba(28,43,35,.04), 0 12px 32px -16px rgba(28,43,35,.18);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0f1712;
        --paper:#182420;
        --text:#eaf0ea;
        --text-muted:#9fb0a6;
        --accent:#6bbf87;
        --accent-soft:#22322a;
        --border:#2c3d33;
        --rule:#33473c;
        --fill-bg:#1c2b24;
        --fill-border:#3a4f41;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 20px 48px -20px rgba(0,0,0,.6);
      }
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .page{
      background:var(--bg);
      color:var(--text);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "URW Palladio L", "Times New Roman", serif;
      min-height:100vh;
      padding: 48px 20px 96px;
      -webkit-font-smoothing:antialiased;
    }
    .sans{ font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .sheet{
      max-width: 760px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .masthead{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding: 22px 40px; border-bottom: 1px solid var(--border); background: var(--accent-soft);
    }
    .masthead a{ text-decoration:none; }
    .wordmark{
      font-family: Georgia, "Iowan Old Style", serif; font-weight: 700; font-size: 19px;
      letter-spacing: 0.01em; color: var(--accent);
    }
    .doc-nav{ font-size: 12.5px; color: var(--text-muted); }
    .doc-nav a{ color: var(--text-muted); }
    .doc-nav a:hover{ color: var(--accent); }
    .doc-header{ padding: 40px 40px 8px; text-align:center; }
    .doc-eyebrow{
      font-family: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); margin: 0 0 10px;
    }
    h1{ font-size: 30px; line-height:1.2; margin: 0 0 6px; text-wrap: balance; }
    .doc-sub{ color: var(--text-muted); font-size: 15px; margin: 0 0 4px; }
    .content{ padding: 8px 40px 44px; }
    article.clause{ margin: 0 0 30px; }
    article.clause h2{
      font-size: 16.5px; letter-spacing: 0.01em; margin: 0 0 10px; padding-bottom: 8px;
      border-bottom: 1px solid var(--rule); display:flex; align-items:baseline; gap: 10px;
    }
    article.clause h2 .num{ font-variant-numeric: tabular-nums; color: var(--accent); }
    article.clause p, article.clause li{ font-size: 15.5px; line-height: 1.68; margin: 0 0 10px; }
    article.clause ol.sub, article.clause ul.sub{ margin: 8px 0 12px; padding-left: 22px; }
    article.clause li{ margin-bottom: 6px; }
    article.clause p:last-child{ margin-bottom:0; }
    .fieldlist{
      font-family: inherit; list-style: none; margin: 10px 0 0; padding: 0;
      display:grid; grid-template-columns: 1fr 1fr; gap: 8px 20px;
    }
    .fieldlist li{ font-size: 13.5px; color: var(--text-muted); border-bottom: 1px dotted var(--rule); padding-bottom: 6px; }
    .fieldlist b{ color: var(--text); font-weight:600; }
    hr.divider{ border:none; border-top: 1px solid var(--rule); margin: 40px 0; }
    .footer-note{ text-align:center; font-family: inherit; font-size: 12px; color: var(--text-muted); padding: 18px 40px 0; }
    @media (max-width: 620px){
      .page{ padding: 24px 10px 64px; }
      .masthead, .doc-header, .content{ padding-left: 22px; padding-right: 22px; }
      .fieldlist{ grid-template-columns: 1fr; }
    }
    @media print{
      body{ background:#fff; }
      .page{ background:#fff; padding:0; }
      .sheet{ box-shadow:none; border:none; max-width:none; }
      .masthead{ background:#fff; }
      article.clause{ break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="sheet">
      <div class="masthead">
        <a class="wordmark sans" href="/">Indiqa</a>
        <span class="doc-nav sans">
          <a href="/juridisch/algemene-voorwaarden">Algemene voorwaarden</a> &nbsp;·&nbsp;
          <a href="/juridisch/verwerkersovereenkomst">Verwerkersovereenkomst</a>
        </span>
      </div>

      <div class="doc-header">
        <p class="doc-eyebrow sans">{% block doc_eyebrow %}{% endblock %}</p>
        <h1>{% block doc_heading %}{% endblock %}</h1>
        <p class="doc-sub sans">{% block doc_sub %}{% endblock %}</p>
      </div>

      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <p class="footer-note">Versie {{ terms_version }} · Indiqa</p>
    </div>
  </div>
</body>
</html>
