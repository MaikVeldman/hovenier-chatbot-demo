<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}Beheer{% endblock %} — Indiqa</title>
  <style>
:root {
  --sidebar-bg:     #1C2B23;
  --sidebar-hover:  #243320;
  --sidebar-active: #2E4A35;
  --sidebar-accent: #3E7C4F;
  --sidebar-text:   rgba(255,255,255,.5);
  --sidebar-hi:     #fff;
  --sidebar-border: rgba(255,255,255,.08);

  --bg:        #F0F4F1;
  --surface:   #fff;
  --surface-2: #F7FAF7;
  --text:      #1C2B23;
  --text-2:    #4A6655;
  --text-3:    #7A9882;
  --border:    #DDE8DF;
  --accent:    #3E7C4F;
  --accent-bg: #E8F4EB;

  --contact-color: #1E5FAF;
  --contact-bg:    #E8F0FD;

  --shadow-sm: 0 1px 3px rgba(28,43,35,.06);
  --shadow:    0 4px 12px rgba(28,43,35,.08);
  --radius: 8px;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ── Sidebar ─────────────────────────────────────── */
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--sidebar-border);
}

.logo-wordmark {
  font-size: 21px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.04em;
}

.sidebar-section {
  padding: 14px 10px 6px;
  flex: 1;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--sidebar-text);
  padding: 0 10px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 6px;
  color: var(--sidebar-text);
  font-size: 13.5px;
  font-weight: 500;
  transition: background .1s, color .1s;
}
.nav-item:hover { background: var(--sidebar-hover); color: var(--sidebar-hi); }
.nav-active     { background: var(--sidebar-active) !important; color: var(--sidebar-hi) !important; }

.nav-icon { width: 15px; height: 15px; flex-shrink: 0; }

.sidebar-bottom {
  padding: 10px 10px 20px;
  border-top: 1px solid var(--sidebar-border);
}

/* ── Main ────────────────────────────────────────── */
.main { flex: 1; min-width: 0; padding: 32px; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
}

.page-title { font-size: 20px; font-weight: 700; }
.page-sub   { font-size: 13px; color: var(--text-3); margin-top: 2px; }

/* ── Cards ───────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.card + .card  { margin-top: 16px; }

.card-header {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  background: var(--surface-2);
}

/* ── Stats grid ──────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}

.stat-num { font-size: 34px; font-weight: 700; color: var(--accent); line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--text-3); margin-top: 5px; font-weight: 500; }

/* ── Table ───────────────────────────────────────── */
.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead tr { background: var(--surface-2); border-bottom: 1px solid var(--border); }

th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
  white-space: nowrap;
}

td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }

/* ── Badges ──────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-contact { background: var(--contact-bg);  color: var(--contact-color); }
.badge-offerte { background: var(--accent-bg);   color: var(--accent); }
.badge-geen    { background: #F0F2F0;             color: var(--text-3); }

.row-link { color: var(--accent); font-weight: 600; }
.row-link:hover { text-decoration: underline; }

/* ── Detail: two-col grid ────────────────────────── */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

/* ── Meta rows ───────────────────────────────────── */
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  gap: 16px;
}
.meta-row:last-child { border-bottom: none; }
.meta-key { color: var(--text-3); white-space: nowrap; }
.meta-val { font-weight: 600; color: var(--text); text-align: right; }

/* ── Back link ───────────────────────────────────── */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 20px;
}
.back-link:hover { color: var(--text); }

/* ── Section title ───────────────────────────────── */
.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin: 24px 0 10px;
}

/* ── Chat log ────────────────────────────────────── */
.chat-log { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }

.chat-msg { display: flex; flex-direction: column; max-width: 72%; gap: 3px; }
.chat-msg.bot  { align-self: flex-start; }
.chat-msg.user { align-self: flex-end; align-items: flex-end; }

.chat-bubble {
  padding: 9px 13px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
}
.chat-msg.bot  .chat-bubble { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
.chat-msg.user .chat-bubble { background: var(--accent); color: #fff; }

.chat-ts { font-size: 10px; color: var(--text-3); padding: 0 3px; }

/* ── Breakdown rows (prijs) ──────────────────────── */
.breakdown-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.breakdown-row:last-child { border-bottom: none; }
.breakdown-lbl  { color: var(--text); flex: 1; }
.breakdown-unit { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.breakdown-eur  { font-weight: 600; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── Empty state ─────────────────────────────────── */
.empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
}
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-wordmark">indiqa</div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">Beheer</div>

    <a class="nav-item {{ 'nav-active' if active == 'overzicht' else '' }}"
       href="{{ url_for('admin_overzicht') }}">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1 2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2zm8 0a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V2zm0 6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V8zM1 10a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-3z"/>
      </svg>
      Overzicht
    </a>

    <a class="nav-item {{ 'nav-active' if active == 'leads' else '' }}"
       href="{{ url_for('admin_leads') }}">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
      </svg>
      Leads
    </a>

    <a class="nav-item {{ 'nav-active' if active == 'tarieven' else '' }}"
       href="{{ url_for('admin_tarieven') }}">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
      </svg>
      Tarieven
    </a>

    <a class="nav-item {{ 'nav-active' if active == 'instellingen' else '' }}"
       href="{{ url_for('admin_instellingen') }}">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
        <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
      </svg>
      Instellingen
    </a>
  </div>

  <div class="sidebar-bottom">
    {% if session.user_email %}
    <div style="padding:10px 14px 4px;font-size:11px;color:var(--sidebar-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="{{ session.user_email }}">
      {{ session.user_email }}
    </div>
    {% endif %}
    <a class="nav-item" href="{{ url_for('admin_logout') }}">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="currentColor">
        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
      </svg>
      Uitloggen
    </a>
  </div>
</nav>

<main class="main">
  {% block content %}{% endblock %}
</main>

</body>
</html>
