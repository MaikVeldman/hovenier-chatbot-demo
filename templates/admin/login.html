<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Inloggen — Indiqa</title>
  <style>
:root {
  --accent: #3E7C4F;
  --accent-hi: #2E5E3B;
  --bg: #F0F4F1;
  --surface: #fff;
  --text: #1C2B23;
  --text-3: #7A9882;
  --border: #DDE8DF;
  --error-bg: #FDECEA;
  --error: #B94040;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 4px 20px rgba(28,43,35,.08);
}

.logo {
  font-size: 22px;
  font-weight: 700;
  color: #1C2B23;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
}

input {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  margin-bottom: 14px;
  transition: border-color .12s;
}
input:focus { border-color: var(--accent); }

.btn {
  display: block;
  width: 100%;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
  transition: background .12s;
}
.btn:hover { background: var(--accent-hi); }

.error {
  background: var(--error-bg);
  color: var(--error);
  border-radius: 7px;
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 16px;
}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">indiqa</div>
    <div style="display:flex;border-bottom:1px solid var(--border);margin:0 -40px 20px;padding:0 40px;">
      <a href="/beheer/login" style="flex:1;padding:9px 0;text-align:center;font-size:13px;font-weight:600;color:var(--accent);border-bottom:2px solid var(--accent);margin-bottom:-1px;text-decoration:none;">Inloggen</a>
      <a href="/aanmelden" style="flex:1;padding:9px 0;text-align:center;font-size:13px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;text-decoration:none;">Aanmelden</a>
    </div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <label for="username">E-mailadres</label>
      <input type="text" id="username" name="username" autocomplete="email" required/>
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required/>
      <button class="btn" type="submit">Inloggen</button>
      <div style="text-align:center;margin-top:14px;">
        <a href="/wachtwoord-vergeten" style="font-size:12px;color:var(--text-3);text-decoration:none;">
          Wachtwoord vergeten?
        </a>
      </div>
    </form>
  </div>
</body>
</html>
