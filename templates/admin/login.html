<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Inloggen</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f1ec; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; color: #1a1a14; }
    .card { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 380px;
            box-shadow: 0 2px 16px rgba(0,0,0,.08); border: 1px solid #d4cfc0; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: #5c6b1e; }
    p.sub { font-size: 13px; color: #6b6b50; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #1a1a14; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #d4cfc0; border-radius: 8px;
            font-size: 14px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #5c6b1e; }
    button { width: 100%; padding: 12px; background: #5c6b1e; color: #fff; border: none;
             border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #46520f; }
    .error { background: #fdecea; color: #b94040; border-radius: 8px; padding: 10px 14px;
             font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Veldman Hoveniers</h1>
    <p class="sub">Admin dashboard — inloggen</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <label for="username">Gebruikersnaam</label>
      <input type="text" id="username" name="username" autocomplete="username" required/>
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required/>
      <button type="submit">Inloggen</button>
    </form>
  </div>
</body>
</html>
