<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nieuw wachtwoord — Indiqa</title>
  <style>
:root {
  --accent: #3E7C4F; --accent-hi: #2E5E3B;
  --bg: #F0F4F1; --surface: #fff;
  --text: #1C2B23; --text-3: #7A9882; --border: #DDE8DF;
  --error-bg: #FDECEA; --error: #B94040;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: var(--bg); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px; width: 100%; max-width: 380px;
  box-shadow: 0 4px 20px rgba(28,43,35,.08);
}
.logo { font-size: 22px; font-weight: 700; color: #1C2B23; letter-spacing: -0.04em; margin-bottom: 24px; }
h1 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
input { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--border);
        border-radius: 7px; font-size: 14px; font-family: inherit; outline: none;
        margin-bottom: 14px; transition: border-color .12s; }
input:focus { border-color: var(--accent); }
.btn { display: block; width: 100%; padding: 11px; background: var(--accent); color: #fff;
       border: none; border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer;
       font-family: inherit; transition: background .12s; }
.btn:hover { background: var(--accent-hi); }
.error { background: var(--error-bg); color: var(--error); border-radius: 7px;
         padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
.ok { background: #E8F4EB; color: var(--accent); border-radius: 7px;
      padding: 12px 16px; font-size: 13px; line-height: 1.5; }
.back { display: block; text-align: center; margin-top: 16px; font-size: 12px;
        color: var(--text-3); text-decoration: none; }
.back:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">indiqa.</div>
    {% if success %}
      <div class="ok">
        Je wachtwoord is gewijzigd. Je kunt nu inloggen met je nieuwe wachtwoord.
      </div>
      <a class="back" href="/beheer/login">Naar inloggen →</a>
    {% else %}
      <h1>Nieuw wachtwoord instellen</h1>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <label for="wachtwoord">Nieuw wachtwoord</label>
        <input type="password" id="wachtwoord" name="wachtwoord"
               placeholder="Min. 8 tekens" required/>
        <label for="wachtwoord2">Herhaal wachtwoord</label>
        <input type="password" id="wachtwoord2" name="wachtwoord2"
               placeholder="••••••••" required/>
        <button class="btn" type="submit">Wachtwoord opslaan</button>
      </form>
      <a class="back" href="/beheer/login">← Terug naar inloggen</a>
    {% endif %}
  </div>
</body>
</html>
